<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign In - Chat App</title>
    <style>
        /* Common styles for auth pages and chat */
        :root {
            --primary-color: #0084ff;
            --primary-hover: #0073e6;
            --background-color: #f0f2f5;
            --card-background: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #65676b;
            --error-color: #dc3545;
            --success-color: #28a745;
            --border-color: #e0e0e0;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--background-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: var(--card-background);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 10px var(--shadow-color);
            width: 100%;
            max-width: 400px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 132, 255, 0.2);
        }

        .button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .button:hover {
            background-color: var(--primary-hover);
        }

        .button:active {
            transform: scale(0.98);
        }

        .button.secondary {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            margin-top: 10px;
        }

        .button.secondary:hover {
            background-color: rgba(0, 132, 255, 0.1);
        }

        .response {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .response.error {
            background-color: rgba(220, 53, 69, 0.1);
            color: var(--error-color);
            display: block;
        }

        .response.success {
            background-color: rgba(40, 167, 69, 0.1);
            color: var(--success-color);
            display: block;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

        .links a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .loading {
            position: relative;
            pointer-events: none;
        }

        .loading:after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin: -10px 0 0 -10px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <h1>Chat App</h1>
            <p>Welcome back!</p>
        </div>

        <form id="signinForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="button">Sign In</button>
            <button type="button" id="chatButton" class="button secondary" style="display:none;">Go to Chat</button>
            <button type="button" id="logoutButton" class="button secondary" style="display:none;">Logout</button>
        </form>

        <div id="response" class="response"></div>

        <div class="links">
            <a href="/api/auth/template/signup/">Don't have an account? Sign up</a>
        </div>
    </div>

    <script>
        document.getElementById('signinForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitButton = this.querySelector('button[type="submit"]');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const responseDiv = document.getElementById('response');

            try {
                submitButton.classList.add('loading');
                const response = await fetch('/api/auth/template/signin/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.status === 200 && data.access) {
                    localStorage.setItem('access_token', data.access);
                    responseDiv.className = 'response success';
                    responseDiv.textContent = "Sign in successful!";

                    document.getElementById('logoutButton').style.display = 'block';
                    document.getElementById('chatButton').style.display = 'block';
                } else {
                    responseDiv.className = 'response error';
                    responseDiv.textContent = data.detail || "Sign in failed. Please check your credentials.";
                }
            } catch (error) {
                responseDiv.className = 'response error';
                responseDiv.textContent = "An error occurred. Please try again.";
            } finally {
                submitButton.classList.remove('loading');
            }
        });

        function logout() {
            localStorage.removeItem('access_token');
            const responseDiv = document.getElementById('response');
            responseDiv.className = 'response success';
            responseDiv.textContent = "Logged out successfully!";

            document.getElementById('logoutButton').style.display = 'none';
            document.getElementById('chatButton').style.display = 'none';
            setTimeout(() => location.reload(), 1500);
        }

        function redirectToChat() {
            const roomName = "room1";
            const token = localStorage.getItem('access_token');
            window.location.href = `/api/chat/${roomName}/?token=${token}`;
        }

        document.getElementById('logoutButton').addEventListener('click', logout);
        document.getElementById('chatButton').addEventListener('click', redirectToChat);
    </script>
</body>
</html>
